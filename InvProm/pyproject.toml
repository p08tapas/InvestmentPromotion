[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invprom"
version = "0.1.0"
description = "Investment Promotion Intelligence Platform for WBIDC (West Bengal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pymupdf>=1.24.0",
]

[tool.setuptools.package-data]
invprom = ["static/*"]

[project.scripts]
invprom = "invprom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
